name: CI

# 提交/PR 自动跑三件事：clippy 零告警、全量测试、前端构建。
# 本地等价命令（提交前自查）：
#   cargo clippy --all-targets -- -D warnings
#   cargo test --no-fail-fast
#   cd web && npm ci && npm run build

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（clippy + 测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链由 rust-toolchain.toml 钉死（stable-x86_64-pc-windows-msvc）
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy（告警即失败）
        run: cargo clippy --all-targets -- -D warnings

      # 沙箱探针的 find_hog() 依赖 target/debug/sandbox_hog.exe，
      # 而 cargo test / clippy 都不产普通 bin，必须显式构建（否则 CI 干净环境必挂）
      - name: 构建二进制（沙箱探针依赖 target/debug 产物）
        run: cargo build --bins

      # 沙箱探针要真拉起受限进程（内存上限探针 60s），单独给时间预算。
      # 托管 runner 起不了受限 token 子进程（cmd/git 未执行即 exit 0xC0000142），
      # 探针测试会宿主自检后跳过并留原因（probes::restricted_host_limitation），本机仍全量执行。
      # 跳过这件事必须看得见：下一步把原因写进 job summary，别让人误以为探针全跑了。
      - name: 测试（全量，不 fail-fast）
        run: cargo test --no-fail-fast
        timeout-minutes: 25

      - name: 沙箱探针是否真跑过（写 job summary）
        shell: pwsh
        run: |
          $out = (cargo test sandbox::probes::tests::host_limitation_report -- --nocapture 2>&1 | Out-String)
          $line = ($out -split "`n" | Where-Object { $_ -match '\[sandbox-probe\]' } | Select-Object -First 1)
          if (-not $line) { $line = '[sandbox-probe] UNKNOWN：报告测试未输出结论，请检查测试是否被编译/运行' }
          "## 沙箱探针`n`n``" + $line.Trim() + "```n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # D14：真起一个隔离实例（随机端口 + 临时数据目录 + mock 渠道），验
      # 令牌 401/200、页面 cookie、流式回答、会话落盘、重启恢复五条契约。
      - name: 端到端冒烟（隔离实例 + mock 渠道）
        run: node scripts/e2e_smoke.mjs

  frontend:
    name: 前端（单测 + 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      # 2026-10-30 起前端有纯逻辑单测（node:test，零额外依赖）：聊天分段/合并、
      # 工具人话化、markdown 安全渲染。UI 改排布最容易回归的就是这些规则。
      - name: 前端单测
        working-directory: web
        run: npm test

      # 前端没有浏览器单测框架，这类回归靠静态体检兜：「fetch 之后忘 .json()」这个 bug 类
      # 在本仓复发过两次（Response 当数据用 → 界面静默显示空值；Response 进
      # postMessage → 插件面板整块瘫），脚本就是为它建的，必须进门禁
      - name: fetch 解析体检
        run: node scripts/check_fetch_json.mjs

      - name: 构建（产物 web/dist，服务直接托管）
        working-directory: web
        run: npm run build

      # {@html} 生成的 markdown 元素没有 Svelte 作用域类，样式必须 :global()；
      # 写错时构建不报错、界面静默退化成默认样式（2026-10-30 实锤），所以构建后验产物。
      - name: markdown 样式产物检查
        run: node scripts/check_md_css.mjs

  # 供应链审计（D7）：已知漏洞 / 许可证白名单 / 依赖来源。策略见仓库根 deny.toml。
  supply-chain:
    name: 供应链（cargo deny）
    # 必须跑 Windows：rust-toolchain.toml 钉的是 stable-x86_64-pc-windows-msvc，
    # Linux runner 上 rustup 会直接报 `target tuple in channel name` 退出（不是 deny 的结论）。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@cargo-deny

      - name: 主 crate（advisories / licenses / bans / sources）
        run: cargo deny check

      # 桌面壳是独立 crate + 独立 lock（tauri 依赖面），同一份策略再过一遍
      - name: 桌面壳 crate
        working-directory: desktop
        run: cargo deny --config ../deny.toml check

  # 桌面壳是独立 crate（start.bat 日常入口会一并起它，内置浏览器就是壳里的 child
  # webview），但它不参与根 crate 的 clippy/test——之前 CI 里连编译都没验证过，
  # 编不过只会在用户机器上炸。这里补一道最小编译门禁。
  desktop:
    name: 桌面壳（构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: 构建壳
        working-directory: desktop
        run: cargo build
