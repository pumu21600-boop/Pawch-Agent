# 供应链审计（2026-11-05 审计修复 D7）：cargo deny check
#
# 只做三件事：已知漏洞（advisories）、许可证白名单（licenses）、依赖来源与写法（bans）。
# 依赖升级策略不在这里管——`windows-sys` / `rand` 的升级牵动 Win32 绑定，单独排期评估。

[advisories]
version = 2
# 被 yank 的版本要看见，但不因此让门禁红：间接依赖被 yank 会随上游自己漂移。
yanked = "warn"
# 豁免必须写理由；能升级就升级，不拿豁免当垃圾桶。
ignore = [
    # —— 维护性告警（无已知漏洞）——
    { id = "RUSTSEC-2025-0057", reason = "fxhash 停止维护：传递依赖、无漏洞、无安全升级路径（wasmtime/cranelift 链，上游替换后自动消失）" },
    { id = "RUSTSEC-2024-0436", reason = "paste 停止维护：传递依赖、无漏洞、无安全升级路径" },
    # —— Linux-only 依赖：rfd → ashpd → zbus 只在 Linux 编译，Windows 版不含这段代码 ——
    { id = "RUSTSEC-2026-0370", reason = "zvariant 公告：rfd/ashpd 的 Linux 门户路径，Windows 构建不编译" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 公告：rfd/ashpd 的 Linux 门户路径，Windows 构建不编译" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 公告：rfd/ashpd 的 Linux 门户路径，Windows 构建不编译" },
    # —— 桌面壳的 GTK/Linux 依赖树（tauri 全平台 lock 带进来，Windows 不编译）——
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 停止维护：glib-macros → GTK 链，Linux 专用，Windows 壳不编译" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 停止维护：tauri GTK/Linux 链，Windows 壳不编译" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 停止维护：tauri GTK/Linux 链，Windows 壳不编译" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 停止维护：tauri GTK/Linux 链，Windows 壳不编译" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 停止维护：tauri GTK/Linux 链，Windows 壳不编译" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 停止维护：tauri GTK/Linux 链，Windows 壳不编译" },
]

[licenses]
version = 2
# 本仓依赖集中在这些常见开源许可下。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
# 许可证字段识别置信度低于阈值时报出来（有些老 crate 的 license 写法不规范）
confidence-threshold = 0.9

[bans]
# 同一 crate 多版本共存很常见（windows-sys 0.5x/0.6x 并存），先只警告不拦。
multiple-versions = "warn"
# 依赖里写 `*` 会导致不可复现构建：直接拒。
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
