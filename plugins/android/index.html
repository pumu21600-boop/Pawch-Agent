<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安卓模拟器</title>
<style>
  /* 主题变量：浅色靠 body.light 整体切换（宿主 pawch:init 带主题进来）。
     背景必须**实色**：透明 iframe 在 WebView2 里会透出壳的默认深色画布——
     浅色模式下整块变黑（2026-11-22 用户实锤大黑块），不能学透明那套 */
  :root { color-scheme: dark; }
  body {
    --bg: #151412; --fg: #f3f1ec; --dim: #8a8478; --line: #332f2a; --line2: #454039;
    --card: #1c1a18; --hover: #262320; --on: #332f2a;
    --err: #e5534b; --ok: #4bb543; --accent: #e8956a;
    /* 选中口径（跟随宿主 data-sel，pawch:init 带 selStyle）：文字高亮=描边无底色+文字高亮 */
    --sel-fg: var(--accent); --sel-bg: transparent;
    --sel-line: color-mix(in srgb, var(--accent) 50%, transparent);
    color-scheme: dark;
  }
  html.light, body.light { color-scheme: light; }
  body.light {
    --bg: #fffefc; --fg: #1f1d1a; --dim: #87827a; --line: #e7e2da; --line2: #d9d3c9;
    --card: #f9f5ef; --hover: #f3f0eb; --on: #efe8df;
    --err: #b3261e; --ok: #1e7a3f; --accent: #b46748;
  }
  body.sel-bg {
    /* 背景高亮=反之：实底无描边 */
    --sel-fg: var(--fg); --sel-bg: var(--on); --sel-line: transparent;
  }
  * { box-sizing: border-box; }
  /* hidden 属性会被下面的 display 声明覆盖，这里钉回去 */
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 0 0 12px;
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  .bar {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  button {
    font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line2); background: transparent; color: var(--fg);
    display: inline-flex; align-items: center; gap: 4px;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary {
    border-color: var(--sel-line); background: var(--sel-bg); color: var(--sel-fg);
    font-weight: 650;
  }
  body:not(.sel-bg) button.primary:hover:not(:disabled) { background: transparent; border-color: var(--accent); }
  .status { margin-left: auto; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { font-size: 12px; padding: 4px 10px 0; min-height: 18px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .screen { display: flex; justify-content: center; padding: 10px; }
  .screen img {
    width: 100%; max-width: 420px; height: auto; border-radius: 10px;
    cursor: crosshair; user-select: none; -webkit-user-drag: none;
    background: var(--card); border: 1px solid var(--line);
  }
  .empty {
    color: var(--dim); font-size: 12.5px; line-height: 1.8;
    text-align: center; padding: 48px 16px;
  }
  .empty .sdk-title { color: var(--fg); font-weight: 650; margin-bottom: 8px; }
  .empty .sdk-err {
    display: inline-block; text-align: left; max-width: 92%;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--fg); white-space: pre-wrap;
    word-break: break-all; margin-bottom: 8px;
  }
  .empty .sdk-sub { text-align: left; max-width: 92%; display: inline-block; }
  .spin {
    width: 22px; height: 22px; margin: 0 auto 10px; border-radius: 50%;
    border: 2px solid var(--line2); border-top-color: var(--accent);
    animation: and-spin 0.9s linear infinite;
  }
  @keyframes and-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="bar">
    <button id="btn-start" class="primary">启动</button>
    <button id="btn-stop">关闭</button>
    <button id="btn-back" title="返回">◁</button>
    <button id="btn-home" title="HOME">○</button>
    <button id="btn-recents" title="最近任务">□</button>
    <span class="status" id="st">加载中…</span>
  </div>
  <div class="msg" id="msg"></div>
  <div class="screen" id="screen" hidden>
    <img id="img" alt="安卓画面" draggable="false" />
  </div>
  <div class="empty" id="empty">模拟器没在跑。<br />点「启动」开机（首次冷启动约 40 秒）。</div>
  <div class="empty" id="booting" hidden><div class="spin"></div>等第一帧画面…</div>

<script>
'use strict';
// —— 桥（usage 同款）：sandbox 不透明源，数据全走 pawch:request → 宿主代发 ——
let seq = 0;
const pending = new Map();
function req(method, params) {
  return new Promise((res, rej) => {
    const id = 'a' + ++seq;
    pending.set(id, { res, rej });
    parent.postMessage({ type: 'pawch:request', id, method, params: params || {} }, '*');
  });
}
parent.postMessage({ type: 'pawch:hello' }, '*');
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'pawch:init') {
    const p = d.payload || {};
    const light = p.theme === 'light';
    document.documentElement.classList.toggle('light', light);
    document.body.classList.toggle('light', light);
    // 选中口径跟随宿主（hl=文字高亮 / bg=背景高亮），主按钮双态同款
    document.body.classList.toggle('sel-bg', p.selStyle === 'bg');
  }
  if (d.type === 'pawch:response') {
    const r = pending.get(d.id);
    if (!r) return;
    pending.delete(d.id);
    d.ok ? r.res(d.result) : r.rej(new Error(String(d.result || '请求失败')));
  }
});

const $ = (id) => document.getElementById(id);
const img = $('img');
const msg = (text, cls) => { $('msg').textContent = text || ''; $('msg').className = 'msg ' + (cls || ''); };
let curSeq = null;
let devW = 0, devH = 0;
let running = false, booted = false;
let busy = false;

function render() {
  $('btn-start').hidden = running;
  $('btn-stop').hidden = !running;
  $('btn-back').hidden = !running;
  $('btn-home').hidden = !running;
  $('btn-recents').hidden = !running;
  $('screen').hidden = !running || !curSeq;
  $('booting').hidden = !running || !!curSeq;
  $('empty').hidden = running;
  $('st').textContent = running
    ? (booted ? `运行中 · ${stateAvd || ''}` : 'boot 中…（首次约 40s）')
    : sdkError ? '缺环境' : '未启动';
  for (const id of ['btn-back', 'btn-home', 'btn-recents']) $(id).disabled = busy || !booted;
  $('btn-start').disabled = busy || !!sdkError;
  $('btn-stop').disabled = busy;
  // 无 SDK 空态：给人话原因和装法引导（不自动下载，GB 级安装要先问位置）。
  // 通用「找不到 Android SDK」跟标题同义不再重复；配置错误（路径不可用等）才亮错误框
  const genericMiss = sdkError === '找不到 Android SDK';
  $('empty').innerHTML = sdkError
    ? `<div class="sdk-title">这台电脑还没有可用的 Android SDK</div>${genericMiss ? '' : `<div class="sdk-err">${esc(sdkError)}</div>`}<div class="sdk-sub">装好 SDK（platform-tools + emulator）后，把根目录写进 设置 android.sdk_path，或设环境变量 PAWCH_AGENT_ANDROID_SDK；也可以直接跟 agent 说「帮我装安卓模拟器环境」。</div>`
    : '模拟器没在跑。<br />点「启动」开机（首次冷启动约 40 秒）。';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
let stateAvd = '';
let sdkError = ''; // 这台电脑没有可用的 Android SDK（状态里带人话原因）

function paint(f) {
  // 带自己的 seq 轮询：画面没动时服务端只回小 JSON（png=null）——不再每 600ms
  // 拖一帧 ~1MB 的 base64 空跑（2026-11-23 CPU 实测后修正）
  if (!f || f.seq == null) { curSeq = null; render(); return; }
  if (f.seq === curSeq || f.png == null) return;
  curSeq = f.seq;
  devW = f.w || 0;
  devH = f.h || 0;
  img.src = 'data:image/png;base64,' + f.png;
  render();
}

async function tickState() {
  try {
    const s = await req('android.state');
    stateAvd = s.avd || '';
    sdkError = s.sdk_ok ? '' : String(s.sdk_error || '找不到 Android SDK');
    const wasRunning = running;
    running = !!s.running;
    booted = !!s.booted;
    if (!running) { curSeq = null; img.removeAttribute('src'); }
    render();
  } catch (e) {
    $('st').textContent = '状态拿不到：' + (e.message || e);
  }
}

async function tickFrame() {
  if (!running) return;
  try {
    paint(await req('android.frame', { seq: curSeq }));
  } catch { /* 模拟器刚关：下一轮 state 会跟上来 */ }
}

async function act(ep, payload) {
  // 轻量动作（点击/滑动/三键）不进 busy 闸：等待期画面点击照常（真机教训）
  try {
    await req('android.action', { ep, payload: payload || {} });
  } catch (e) {
    msg(e.message || String(e), 'err');
  }
}

// 启动/关闭等得久（start 等 boot 40s+）：提示进行中，busy 只锁这两个按钮
async function slow(ep, note) {
  busy = true; render(); msg(note || '', 'ok');
  try {
    await req('android.action', { ep });
    msg('', '');
  } catch (e) {
    msg(e.message || String(e), 'err');
  }
  busy = false;
  render();
  tickState(); tickFrame();
}

$('btn-start').onclick = () => slow('start', '启动中…（首次约 40 秒）');
$('btn-stop').onclick = () => slow('stop', '关闭中…');
$('btn-back').onclick = () => act('key', { keycode: 4 });
$('btn-home').onclick = () => act('key', { keycode: 3 });
$('btn-recents').onclick = () => act('key', { keycode: 187 });

// 画面点击 → 设备坐标（帧是全分辨率原图，按显示比例反算）
img.addEventListener('click', (e) => {
  if (!devW) return;
  const r = img.getBoundingClientRect();
  const x = Math.round(((e.clientX - r.left) / r.width) * devW);
  const y = Math.round(((e.clientY - r.top) / r.height) * devH);
  act('touch', { x, y });
});
// 滚轮 → 滑动（250ms 节流）
let lastWheel = 0;
$('screen').addEventListener('wheel', (e) => {
  if (!devW) return;
  e.preventDefault();
  const now = Date.now();
  if (now - lastWheel < 250) return;
  lastWheel = now;
  const dy = e.deltaY;
  if (!dy) return;
  const cx = Math.round(devW / 2);
  const y0 = Math.round(devH * 0.68);
  act('touch', { x: cx, y: y0, x2: cx, y2: Math.max(60, y0 - dy * 2.5), duration_ms: 220 });
}, { passive: false });

// 轮询节奏：状态 2s、帧 600ms（seq 没变只拉小 JSON，静止画面零大传输）
setInterval(tickState, 2000);
setInterval(tickFrame, 600);
tickState(); tickFrame();
render();
</script>
</body>
</html>
